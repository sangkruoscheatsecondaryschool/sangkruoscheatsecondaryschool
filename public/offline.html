<!doctype html>
<html lang="km">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e40af" />
    <title>គ្មានការតភ្ជាប់ | School</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 360px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 24px;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { margin: 0 0 16px; color: #64748b; font-size: 14px; line-height: 1.7; }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { background: #1d4ed8; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>គ្មានការតភ្ជាប់អ៊ីនធឺណិត</h1>
      <p>
        សូមពិនិត្យការតភ្ជាប់អ៊ីនធឺណិតរបស់អ្នក រួចព្យាយាមម្ដងទៀត។
      </p>
      <button onclick="location.reload()">ព្យាយាមម្ដងទៀត</button>
    </div>
  </body>
</html>
